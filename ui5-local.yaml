# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: migrationapp
type: application
framework:
  name: SAPUI5
  version: 1.136.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: http://vhcalhdbdb.dummy.nodomain:50000
          - url: http://vhcalhdbdb.dummy.nodomain:50000
            client: '100'
            path: /sap/opu/odata/sap/ZY_MIGRATION_SRV/
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:ZY_MIGRATION_SRV
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZY_MIGRATION_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZY_ODATA_MIGRATION_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZY_ODATA_MIGRATION_ANNO_MDL',Version='0001')/$value/
